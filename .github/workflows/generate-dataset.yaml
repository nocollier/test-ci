name: Generate the datasets
on:
  workflow_dispatch:

jobs:
  generate-dataset:
    name: Generate the dataset to be ingested
    runs-on: ubuntu-latest
    if: github.repository == 'nocollier/test-ci'
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run the generation action
        uses: ./.github/actions/generate-dataset
