name: Generate & visualize
on:
  pull_request:
    branches:
      - main

jobs:
  generate-dataset:
    name: Create the dataset(s) to be ingested
    runs-on: ubuntu-latest
    if: github.repository == 'nocollier/test-ci'
    permissions:
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Get changed files in this PR
        uses: jitterbit/get-changed-files@v1
        id: files
      - name: Run the data generation scripts
        id: ingest
        run: |
          uv run python ./scripts/run_generation_scripts.py ${{ steps.files.outputs.all }}
          cat to_ingest.txt >> "$GITHUB_OUTPUT"
      - name: Gen
        run: |
          for FPATH in ${{ steps.ingest.outputs }}; do
            echo $FPATH
          done
      #- name: Run the ncdump action
