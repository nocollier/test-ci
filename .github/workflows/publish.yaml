name: Publish from Comment

on:
  issue_comment:
    types: [created, edited]

jobs:
  publish-datasets:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/publish') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch PR Details
        id: pr_details
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRepository)
          BRANCH_NAME=$(echo "$PR_JSON" | jq -r '.headRepository.id')
          REPO_NAME=$(echo "$PR_JSON" | jq -r '.headRepository.nameWithOwner')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GHT }}
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_details.outputs.repo }}
          ref: ${{ steps.pr_details.outputs.branch }}
      - name: Verify Clone
        run: |
          git branch
          git log -1
      - name: Check user permission
        run: |
          echo "Triggered by an admin/collaborator: ${{ github.event.comment.user.login }}"
      - name: Restore cache
        id: cache-raw-and-artifacts
        uses: actions/cache/restore@v6
        with:
          path: |
            data/*/_raw/*
            data/*/*.nc
            to_ingest.txt
          key: ${{ github.event.number }}-cache
      - name: Add dataset(s) to registry
        run: |
          ls -l
          tree .

