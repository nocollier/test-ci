name: Publish from Comment

on:
  issue_comment:
    types: [created, edited]

jobs:
  run-ci:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/publish') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check user permission
        run: |
          echo "Triggered by an admin/collaborator: ${{ github.event.comment.user.login }}"
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.head.ref }}
      - uses: actions/checkout@v6
      - name: Restore cache
        id: cache-raw-and-artifacts
        uses: actions/cache/restore@v6
        with:
          path: |
            data/*/_raw/*
            data/*/*.nc
            to_ingest.txt
          key: ${{ github.event.number }}-cache
      - name: Add dataset(s) to registry
        run: |
          ls -l
          tree .

